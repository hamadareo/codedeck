name: Release

# Push a tag "v<version>" (the same version as package.json) to build the installers,
# test them after installing on clean runners, and attach them to a draft GitHub Release.
# Nothing is published until both platforms pass; then one job creates one draft with all files.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Build installers
        shell: bash
        env:
          # macOS signing / notarization: used only when these secrets exist.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -z "$CSC_LINK" ]; then
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              unset CSC_LINK CSC_KEY_PASSWORD
            fi
            if [ -n "$APPLE_ID" ] && [ -n "$CSC_LINK" ]; then EXTRA="-c.mac.notarize=true"; fi
          else
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          npx electron-builder --publish never $EXTRA

      - name: Install the built installer (clean runner, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release\*-win-*.exe | Select-Object -First 1).FullName
          $dest = Join-Path $env:RUNNER_TEMP 'CodeDeck Installed'
          # NSIS silent install into a chosen folder (/D must be last and unquoted).
          $p = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$dest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          if (-not (Test-Path "$dest\CodeDeck.exe")) { throw "CodeDeck.exe not installed in $dest" }
          "CODEDECK_E2E_EXECUTABLE=$dest\CodeDeck.exe" >> $env:GITHUB_ENV

      - name: Install the built installer (clean runner, macOS)
        if: runner.os == 'macOS'
        run: |
          DMG="$(ls release/*-mac-*.dmg | head -1)"
          hdiutil attach "$DMG" -nobrowse -mountpoint /Volumes/CodeDeckDMG
          mkdir -p "$RUNNER_TEMP/Applications"
          cp -R /Volumes/CodeDeckDMG/CodeDeck.app "$RUNNER_TEMP/Applications/"
          hdiutil detach /Volumes/CodeDeckDMG
          echo "CODEDECK_E2E_EXECUTABLE=$RUNNER_TEMP/Applications/CodeDeck.app/Contents/MacOS/CodeDeck" >> "$GITHUB_ENV"

      - name: E2E against the installed app
        run: npx playwright test app.spec phase2.spec phase3.spec phase4.spec phase5.spec phase6.spec resume.spec files.spec

      - uses: actions/upload-artifact@v6
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/latest*.yml
            release/*.blockmap
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results
          retention-days: 7

  release:
    name: draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: Create the draft release with every installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "CodeDeck ${GITHUB_REF_NAME#v}" --notes "CodeDeck ${GITHUB_REF_NAME#v}"
