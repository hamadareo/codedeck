name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spike:
    name: Phase 0 spike (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: spike
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spike/package-lock.json
      - run: npm ci
      - name: node-pty smoke (env passthrough, spaces + Japanese path, resize)
        run: node pty-smoke.mjs
      - name: Package (unsigned, --dir)
        run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify node-pty is unpacked from asar
        shell: bash
        run: |
          find release -path '*app.asar.unpacked/node_modules/node-pty*' -name '*.node' | head -5
          test -n "$(find release -path '*app.asar.unpacked/node_modules/node-pty*' -name '*.node' | head -1)"
      - uses: actions/upload-artifact@v4
        with:
          name: spike-${{ matrix.os }}
          path: spike/release
          retention-days: 7
