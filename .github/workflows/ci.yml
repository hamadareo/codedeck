name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  app:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm run typecheck
      - name: Unit tests
        run: npm test
      - run: npm run build
      - name: E2E (fake claude, dev build)
        run: npx playwright test
      - name: Package (unsigned, --dir)
        run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: E2E (fake claude, packaged build)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export CODEDECK_E2E_EXECUTABLE="$PWD/release/win-unpacked/CodeDeck.exe"
          else
            export CODEDECK_E2E_EXECUTABLE="$(ls -d "$PWD"/release/mac*/CodeDeck.app | head -1)/Contents/MacOS/CodeDeck"
          fi
          echo "$CODEDECK_E2E_EXECUTABLE"
          npx playwright test app.spec
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results
          retention-days: 7
